name: build-deb
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest && pip install -e . && pytest
  deb:
    needs: test
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y git build-essential devscripts debhelper dh-python pybuild-plugin-pyproject python3-all python3-setuptools
      - uses: actions/checkout@v4
      - run: dpkg-buildpackage -us -uc -b
      - run: mkdir out && cp ../*.deb out/
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: out/*.deb }
      - name: Add a stable-name copy for releases/latest/download/motd-forge_all.deb
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir release && cp out/*.deb release/
          cp out/*.deb release/motd-forge_all.deb
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: release/*.deb }
  apt-repo:
    # Publishes a signed apt repository to the gh-pages branch on every v* tag.
    needs: deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: deb, path: debs }
      - name: Fetch existing repository (keeps older versions)
        run: git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site || mkdir site
      - name: Import signing key
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          test -n "$KEY" || { echo "secret APT_GPG_PRIVATE_KEY is not set (see docs/apt-repo.md)"; exit 1; }
          printf '%s' "$KEY" | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import
      - name: Build repository
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: sudo apt-get install -y dpkg-dev >/dev/null && ./scripts/build-apt-repo.sh site debs
      - name: Publish to gh-pages
        run: |
          cd site
          git init -q 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -B gh-pages
          git add -A
          git commit -qm "apt repo for ${{ github.ref_name }}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
