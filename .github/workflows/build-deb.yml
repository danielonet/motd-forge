name: build-deb
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest && pip install -e . && pytest
  deb:
    needs: test
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y git build-essential devscripts debhelper dh-python pybuild-plugin-pyproject python3-all python3-setuptools
      - uses: actions/checkout@v4
      - run: dpkg-buildpackage -us -uc -b
      - run: mkdir out && cp ../*.deb out/
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: out/*.deb }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: out/*.deb }
